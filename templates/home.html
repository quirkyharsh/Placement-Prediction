<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Prediction System</title>

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0f172a, #1e293b, #2563eb);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 30px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 25px;
            padding: 40px;
            color: white;
            box-shadow: 0px 10px 40px rgba(0, 0, 0, 0.35);
        }

        .title {
            text-align: center;
            margin-bottom: 35px;
        }

        .title h1 {
            font-size: 38px;
            margin-bottom: 10px;
            font-weight: 700;
        }

        .title p {
            color: #d1d5db;
            font-size: 15px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 22px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
        }

        .input-group label {
            margin-bottom: 8px;
            font-size: 14px;
            font-weight: 500;
        }

        .input-group input,
        .input-group select {
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.12);
            color: white;
            outline: none;
            font-size: 15px;
            transition: 0.3s ease;
        }

        .input-group input::placeholder {
            color: #cbd5e1;
        }

        .input-group select option {
            color: black;
        }

        .input-group input:focus,
        .input-group select:focus {
            background: rgba(255, 255, 255, 0.18);
            border: 1px solid #60a5fa;
        }

        .full-width {
            grid-column: span 2;
        }

        .predict-btn {
            width: 100%;
            padding: 16px;
            border: none;
            border-radius: 14px;
            background: linear-gradient(90deg, #2563eb, #38bdf8);
            color: white;
            font-size: 17px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s ease;
        }

        .predict-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0px 8px 25px rgba(56, 189, 248, 0.4);
        }

        .result-box {
            margin-top: 30px;
            padding: 20px;
            border-radius: 15px;
            text-align: center;
            background: rgba(255, 255, 255, 0.12);
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        .result-box h2 {
            font-size: 28px;
            color: #facc15;
        }

        @media(max-width: 850px) {

            form {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: span 1;
            }

            .title h1 {
                font-size: 30px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <div class="title">
            <h1>Placement Prediction System</h1>
            <p>
                Predict whether a student is likely to get placed
                based on academic performance and skills.
            </p>
        </div>

        <form action="{{ url_for('predict_datapoint') }}" method="post">

            <div class="input-group">
                <label>CGPA</label>
                <input type="number" step="0.01" name="CGPA"
                    placeholder="Enter CGPA" required>
            </div>

            <div class="input-group">
                <label>Internships</label>
                <input type="number" name="Internships"
                    placeholder="Number of Internships" required>
            </div>

            <div class="input-group">
                <label>Projects</label>
                <input type="number" name="Projects"
                    placeholder="Number of Projects" required>
            </div>

            <div class="input-group">
                <label>Workshops / Certifications</label>
                <input type="number" name="Workshops_Certifications"
                    placeholder="Enter count" required>
            </div>

            <div class="input-group">
                <label>Aptitude Test Score</label>
                <input type="number" name="AptitudeTestScore"
                    placeholder="Out of 100" required>
            </div>

            <div class="input-group">
                <label>Soft Skills Rating</label>
                <input type="number" step="0.1" name="SoftSkillsRating"
                    placeholder="Rating out of 5" required>
            </div>

            <div class="input-group">
                <label>Extracurricular Activities</label>
                <select name="ExtracurricularActivities" required>
                    <option selected disabled value="">
                        Select Option
                    </option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="input-group">
                <label>Placement Training</label>
                <select name="PlacementTraining" required>
                    <option selected disabled value="">
                        Select Option
                    </option>
                    <option value="1">Yes</option>
                    <option value="0">No</option>
                </select>
            </div>

            <div class="input-group">
                <label>SSC Marks</label>
                <input type="number" name="SSC_Marks"
                    placeholder="10th Percentage" required>
            </div>

            <div class="input-group">
                <label>HSC Marks</label>
                <input type="number" name="HSC_Marks"
                    placeholder="12th Percentage" required>
            </div>

            <div class="full-width">
                <button class="predict-btn" type="submit">
                    Predict Placement
                </button>
            </div>

        </form>

        {% if results %}

        <div class="result-box">
            <h2>{{ results }}</h2>
        </div>

        {% endif %}

    </div>

</body>

</html>
